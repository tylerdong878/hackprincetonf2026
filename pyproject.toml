[project]
name = "grain-of-salt"
version = "0.1.0"
description = "Grain of Salt: a media-literacy detective game. An AI con artist doctors real New Jersey news."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "matplotlib>=3.9",
    "deepagents>=0.7.38",
    "langchain-openrouter>=0.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipeline/tests"]
pythonpath = ["."]
